<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fv-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fv-text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="fv-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#080c14"/>
  <!-- Gradient border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#fv-border)" stroke-width="2"/>
  <!-- Corner dots -->
  <circle cx="13" cy="13" r="1.5" fill="#1e2d45" opacity="0.9"/>
  <circle cx="51" cy="13" r="1.5" fill="#1e2d45" opacity="0.9"/>
  <circle cx="13" cy="51" r="1.5" fill="#1e2d45" opacity="0.35"/>
  <circle cx="51" cy="51" r="1.5" fill="#1e2d45" opacity="0.35"/>
  <!-- CC text -->
  <text x="32" y="36" text-anchor="middle" dominant-baseline="central"
        font-family="'Syne','Inter',sans-serif" font-size="26" font-weight="800"
        letter-spacing="-1" fill="url(#fv-text)">CC</text>
  <!-- Mini bar chart -->
  <rect x="17" y="50" width="3" height="4" rx="1" fill="url(#fv-bar)" opacity="0.5"/>
  <rect x="22" y="48" width="3" height="6" rx="1" fill="url(#fv-bar)" opacity="0.65"/>
  <rect x="27" y="45" width="3" height="9" rx="1" fill="url(#fv-bar)" opacity="0.85"/>
  <rect x="32" y="47" width="3" height="7" rx="1" fill="url(#fv-bar)" opacity="0.75"/>
  <rect x="37" y="49" width="3" height="5" rx="1" fill="url(#fv-bar)" opacity="0.65"/>
  <rect x="42" y="51" width="3" height="3" rx="1" fill="url(#fv-bar)" opacity="0.5"/>
  <line x1="15" y1="55" x2="49" y2="55" stroke="#1a2235" stroke-width="0.5"/>
</svg>
